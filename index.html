<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mochi" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>Mochi</title>
    <meta name="description" content="Tus apuntes de la facu, ordenados por año y materia. Se guardan en tu Google Drive." />

    <!-- Vista previa al compartir el link (WhatsApp, Instagram, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mochi" />
    <meta property="og:title" content="Mochi · Tus apuntes de la facu" />
    <meta property="og:description" content="Ordenados por año y materia, en la compu y en el celu. Se guardan en tu Google Drive." />
    <meta property="og:url" content="https://mochi-facu.vercel.app/" />
    <!-- Cuadrada: WhatsApp recorta la vista previa en un cuadrado y así el logo se ve entero. -->
    <meta property="og:image" content="https://mochi-facu.vercel.app/og-square.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:alt" content="Logo de Mochi: una mochila roja" />
    <meta property="og:locale" content="es_AR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://mochi-facu.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
